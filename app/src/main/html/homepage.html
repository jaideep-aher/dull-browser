<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>${TITLE}</title>
    <style>
        :root {
            color-scheme: {SCHEME};
            --body-bg: {COLOR};
            --box-bg: {COLOR};
            --box-txt: {COLOR};
            --muted: {COLOR};
            --border: {COLOR};
        }

        html, body {
            margin: 0;
            background: var(--body-bg);
            color: var(--box-txt);
            font-family: sans-serif;
        }

        main {
            max-width: 36rem;
            margin: 0 auto;
            padding: 22vh 20px 48px;
            box-sizing: border-box;
            text-align: center;
        }

        #clock {
            font-size: 56px;
            font-weight: 300;
            letter-spacing: -0.02em;
            margin: 0 0 32px;
            font-variant-numeric: tabular-nums;
        }

        #clock[hidden] {
            display: none;
        }

        #countdown {
            font-size: 15px;
            color: var(--muted);
            margin: -16px 0 32px;
        }

        #countdown[hidden], #links[hidden], #milestone[hidden] {
            display: none;
        }

        #links {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px 12px;
            margin: 28px 0 0;
            text-align: center;
        }

        #links a {
            color: inherit;
            text-decoration: none;
        }

        .link-mark {
            width: 44px;
            height: 44px;
            margin: 0 auto 6px;
            border: 1px solid var(--border);
            border-radius: 22px;
            line-height: 42px;
            font-size: 17px;
        }

        .link-title {
            font-size: 11px;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #milestone {
            position: fixed;
            left: 20px;
            right: 20px;
            bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--body-bg);
            text-align: left;
            font-size: 15px;
        }

        #milestone a {
            margin-left: auto;
            color: var(--muted);
            text-decoration: none;
            padding: 8px;
        }

        form {
            margin: 0;
        }

        #search_input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--body-bg);
            color: var(--box-txt);
            font: inherit;
            font-size: 16px;
            height: 48px;
            padding: 0 20px;
            outline: none;
            -webkit-appearance: none;
        }

        #search_input:focus {
            background: var(--box-bg);
            border-color: var(--box-bg);
        }

        #search_input::placeholder {
            color: var(--muted);
        }
    </style>
</head>
<body>
<main>
    <p id="clock"></p>
    <p id="countdown" hidden></p>
    <form onsubmit="return search()" autocomplete="off">
        <input id="search_input" type="text" placeholder="Search" enterkeyhint="search"/>
    </form>
    <div id="links" hidden></div>
</main>
<div id="milestone" hidden>
    <span id="milestone_text"></span>
    <a href="dull://focus/dismiss-milestone" aria-label="Dismiss">×</a>
</div>
<script>
    var clockMode = "${CLOCK}";
    var clock = document.getElementById("clock");

    function pad(n) {
        return ("0" + n).slice(-2);
    }

    function tick() {
        var d = new Date();
        var h = d.getHours();
        var m = pad(d.getMinutes());
        var s = pad(d.getSeconds());
        if (clockMode === "24") {
            clock.textContent = pad(h) + ":" + m + ":" + s;
        } else {
            clock.textContent = ((h % 12) || 12) + ":" + m + ":" + s;
        }
    }

    if (clockMode === "off") {
        clock.hidden = true;
    } else {
        tick();
        setInterval(tick, 1000);
    }
</script>
<script>
    document.getElementById("search_input").placeholder = "${SEARCH_HINT}";

    function search() {
        var value = document.getElementById("search_input").value;
        if (value) {
            window.location.href = "${BASE_URL}" + encodeURIComponent(value);
        }
        return false;
    }

    var countdown = "${COUNTDOWN}";
    if (countdown) {
        var label = document.getElementById("countdown");
        label.textContent = countdown;
        label.hidden = false;
    }

    var milestone = "${MILESTONE}";
    if (milestone) {
        var notice = document.getElementById("milestone");
        document.getElementById("milestone_text").textContent = milestone + " calm days in a row.";
        notice.hidden = false;
    }

    var links = JSON.parse("${QUICK_LINKS}");
    if (links.length) {
        var box = document.getElementById("links");
        box.hidden = false;
        links.forEach(function (link, index) {
            var a = document.createElement("a");
            a.href = link.url;
            a.setAttribute("data-index", index);
            var mark = document.createElement("div");
            mark.className = "link-mark";
            var host = (link.host || link.title || "?").replace(/^www\./, "");
            mark.textContent = host.charAt(0).toUpperCase();
            var title = document.createElement("div");
            title.className = "link-title";
            title.textContent = link.title;
            a.appendChild(mark);
            a.appendChild(title);
            box.appendChild(a);
        });
    }
</script>
</body>
</html>
