<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>${TITLE}</title>
    <style>
        :root {
            color-scheme: {SCHEME};
            --body-bg: {COLOR};
            --box-bg: {COLOR};
            --box-txt: {COLOR};
            --muted: {COLOR};
            --border: {COLOR};
        }

        html, body {
            margin: 0;
            background: var(--body-bg);
            color: var(--box-txt);
            font-family: sans-serif;
        }

        main {
            max-width: 36rem;
            margin: 0 auto;
            padding: 22vh 20px 48px;
            box-sizing: border-box;
            text-align: center;
        }

        #clock {
            font-size: 56px;
            font-weight: 300;
            letter-spacing: -0.02em;
            margin: 0 0 32px;
        }

        #clock[hidden] {
            display: none;
        }

        form {
            margin: 0;
        }

        #search_input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--body-bg);
            color: var(--box-txt);
            font: inherit;
            font-size: 16px;
            height: 48px;
            padding: 0 20px;
            outline: none;
            -webkit-appearance: none;
        }

        #search_input:focus {
            background: var(--box-bg);
            border-color: var(--box-bg);
        }

        #search_input::placeholder {
            color: var(--muted);
        }
    </style>
</head>
<body>
<main>
    <p id="clock"></p>
    <form onsubmit="return search()" autocomplete="off">
        <input id="search_input" type="text" placeholder="Search" enterkeyhint="search"/>
    </form>
</main>
<script>
    var clockMode = "${CLOCK}";
    var clock = document.getElementById("clock");
    document.getElementById("search_input").placeholder = "${SEARCH_HINT}";

    function tick() {
        var d = new Date();
        var h = d.getHours();
        var m = ("0" + d.getMinutes()).slice(-2);
        clock.textContent = (clockMode === "24" ? ("0" + h).slice(-2) : ((h % 12) || 12)) + ":" + m;
    }

    if (clockMode === "off") {
        clock.hidden = true;
    } else {
        tick();
        setInterval(tick, 10000);
    }

    function search() {
        var value = document.getElementById("search_input").value;
        if (value) {
            window.location.href = "${BASE_URL}" + encodeURIComponent(value);
        }
        return false;
    }
</script>
</body>
</html>
